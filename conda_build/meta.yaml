# version.cmake is the single source of the release version: scikit-build-core
# stamps it onto the Python distribution (pyproject.toml declares the version
# as dynamic, so there is no `project.version` to read) and CMake compiles it
# into cytnx.__version__. The pattern is the one pyproject.toml's
# [tool.scikit-build.metadata.version] block uses, read from the recipe
# directory so it resolves before the source is copied into the work
# directory. If version.cmake is missing or does not match, rendering stops
# here, before anything is built.
{% set version_match = load_file_regex(
     load_file='../version.cmake',
     from_recipe_dir=True,
     regex_pattern='set\\(\\w+?VERSION_MAJOR\\s+(\\d+)\\)\\s+set\\(\\w+?VERSION_MINOR\\s+(\\d+)\\)\\s+set\\(\\w+?VERSION_PATCH\\s+(\\d+)\\)') %}
{% set version = version_match.groups() | join('.') %}

package:
  name: cytnx
  version: {{ version }}

source:
  path: ../

build:
  number: 0
  script_env:
    # Refer to : https://github.com/ccache/ccache/discussions/821#discussioncomment-521209
    - CCACHE_NOHASHDIR=1
    - CCACHE_COMPILERCHECK=content
    - CCACHE_DIR
    - CCACHE_MAXSIZE
    - CMAKE_C_COMPILER_LAUNCHER
    - CMAKE_CXX_COMPILER_LAUNCHER
    - CMAKE_CUDA_COMPILER_LAUNCHER
    - CMAKE_PRESET=mkl-cpu            # [x86]
    - CMAKE_PRESET=openblas-cpu       # [not x86]
    # Which of HPTT's hand-vectorized kernel families to compile. They are
    # opt-in per target architecture and HPTT rejects an option its target
    # cannot serve, so build.sh passes this one through only when a selector
    # below matched; any other architecture builds HPTT's scalar fallback.
    - CYTNX_HPTT_ISA_OPTION=HPTT_ENABLE_AVX     # [x86_64]
    - CYTNX_HPTT_ISA_OPTION=HPTT_ENABLE_ARM     # [aarch64 or arm64]

requirements:
  build:
    - ccache
    - cmake
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python {{ python }}
    # Ensure pip>=23.1 so repeated
    # --config-settings keys append correctly for skbuild.cmake.args.
    - pip >=23.1
    - scikit-build-core
    - pybind11
    - boost >=1.82.0
    - blas=*=mkl            # [x86]
    - blas=*=openblas       # [not x86]
    - gtest
    - arpack
  run:
    - python
    - numpy >=1.18
    - boost >=1.82.0
    - python-graphviz
    - graphviz
    - blas=*=mkl            # [x86]
    - blas=*=openblas       # [not x86]
    - beartype
    - arpack

# Runs against the built archive, installed into a fresh environment that
# holds only the run requirements above plus pip and pytest: nothing from the
# build tree is on the path. tools/artifact_smoke_test.py imports cytnx before
# anything else, checks that the conda record, the Python distribution and
# cytnx.__version__ all carry the version.cmake version, and runs a small
# numerical smoke test. The Python test suite then runs against the installed
# package, with the same exclusions as the wheel workflows
# (.github/workflows/release_pypi.yml): tests that read files of the checkout
# that are not copied here, and the one that needs scipy. A failure fails
# `conda build`, which is what stops the release workflow before its upload
# step.
test:
  source_files:
    - version.cmake
    - tools/artifact_smoke_test.py
    - pytests
  requires:
    - pip
    - pytest
  imports:
    - cytnx
  commands:
    - python tools/artifact_smoke_test.py --version-cmake version.cmake --check-conda-metadata
    - >-
      python -m pytest -p no:cacheprovider pytests
      --ignore=pytests/example
      --ignore=pytests/version_test.py
      --ignore=pytests/prune_nightly_wheels_test.py
      --ignore=pytests/release_tools_test.py
      --ignore=pytests/random_distribution_test.py
    - pip check
