{% set data = load_file_data('pyproject.toml') %}
{% set version = data.get('project').get('version') %}

package:
  name: cytnx
  version: {{ version }}

source:
  path: ../

build:
  number: 0
  script_env:
    # Refer to : https://github.com/ccache/ccache/discussions/821#discussioncomment-521209
    - CCACHE_NOHASHDIR=1
    - CCACHE_COMPILERCHECK=content
    - CCACHE_DIR
    - CCACHE_MAXSIZE
    - CMAKE_C_COMPILER_LAUNCHER
    - CMAKE_CXX_COMPILER_LAUNCHER
    - CMAKE_CUDA_COMPILER_LAUNCHER
    - CMAKE_PRESET=mkl-cpu            # [x86]
    - CMAKE_PRESET=openblas-cpu       # [not x86]
    # Which of HPTT's hand-vectorized kernel families to compile. They are
    # opt-in per target architecture and HPTT rejects an option its target
    # cannot serve, so build.sh passes this one through only when a selector
    # below matched; any other architecture builds HPTT's scalar fallback.
    - CYTNX_HPTT_ISA_OPTION=HPTT_ENABLE_AVX     # [x86_64]
    - CYTNX_HPTT_ISA_OPTION=HPTT_ENABLE_ARM     # [aarch64 or arm64]

requirements:
  build:
    - ccache
    - cmake
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python {{ python }}
    # Ensure pip>=23.1 so repeated
    # --config-settings keys append correctly for skbuild.cmake.args.
    - pip >=23.1
    - scikit-build-core
    - pybind11
    - boost >=1.82.0
    - blas=*=mkl            # [x86]
    - blas=*=openblas       # [not x86]
    - gtest
    - arpack
  run:
    - python
    - numpy >=1.18
    - boost >=1.82.0
    - python-graphviz
    - graphviz
    - blas=*=mkl            # [x86]
    - blas=*=openblas       # [not x86]
    - beartype
    - arpack

test:
  requires:
    - gtest
