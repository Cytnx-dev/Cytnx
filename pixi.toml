[workspace]
name = "cytnx-dev"
channels = ["conda-forge"]
# Every platform cytnx is developed on. The lock file resolves all of them,
# so a contributor on any one of them gets the same dependency versions.
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
pip = "*"
scikit-build-core = ">=0.11,<1"

# Build tools. c-compiler/cxx-compiler resolve to the platform's toolchain:
# GCC on Linux and Clang on macOS come from conda-forge, while on Windows the
# packages are activation glue for an existing Visual Studio 2022 install and
# do not contain MSVC itself.
cmake = ">=3.31,<4"
ninja = ">=1.11"
git = "*"
c-compiler = ">=1.11,<2"
cxx-compiler = ">=1.11,<2"
# Must match the clang-format revision pinned in .pre-commit-config.yaml;
# a different major version reflows code and fails the format CI job.
clang-format = "14.*"
pre-commit = "*"

# Native dependencies shared by the development environments. BLAS, LAPACK and
# LAPACKE are not listed here: each of the two vendor features below pins the
# whole stack to one vendor's builds, so an environment cannot end up with a
# half-OpenBLAS, half-netlib mixture.
arpack = { version = ">=3.9,<4", build = "nompi_*" }
libboost-devel = "*"
gtest = "*"
gmock = "*"

[pypi-dependencies]
# Only what has to exist before pip runs. pybind11 is here because
# find_package(pybind11) has to succeed for a bare `cmake --preset`, before any
# editable install has happened; its version must match the pin in
# pyproject.toml's [build-system].requires, which is what the wheel builds and
# the committed stubs are generated against.
#
# Nothing else Python-side is listed. numpy, beartype, graphviz, pytest,
# pytest-cov, mypy and pybind11-stubgen are declared in pyproject.toml and
# arrive with `pip install --editable .[dev]`, which the install-python task
# runs -- pyproject.toml stays the single source of truth for them.
pybind11 = "==3.0.4"

[target.win-64.pypi-dependencies]
# Reads PE export tables in tools/prepare_windows_import_libraries.py, which
# only ever runs on Windows.
pefile = ">=2024.8.26"

# Contributor environments stay fixed at the oldest supported interpreter.
[feature.python310.dependencies]
python = "3.10.*"

[feature.openblas.dependencies]
# `openblas` is the development split: it is what provides the libopenblas.so
# symlink and the lapacke.h header that CMake's FindBLAS and morse_cmake's
# FindLAPACKE look for. The runtime-only libopenblas package has neither.
#
# The OpenMP-threaded build matches the pin in ci-cmake_tests.yml: the pthreads
# build runs a thread pool of its own, which oversubscribes the CPU whenever a
# BLAS call originates inside one of cytnx's or HPTT's OpenMP regions.
openblas = { build = "openmp*" }
libopenblas = { build = "openmp*" }
libblas = { version = ">=3.9,<4", build = "*openblas" }
liblapack = { version = ">=3.9,<4", build = "*openblas" }
liblapacke = { version = ">=3.9,<4", build = "*openblas" }

[feature.mkl]
# Intel MKL is x86-only, so the mkl environment does not exist for the two
# ARM platforms; they build against the default OpenBLAS environment.
platforms = ["linux-64", "osx-64", "win-64"]

[feature.mkl.dependencies]
mkl-devel = "*"
libblas = { version = ">=3.9,<4", build = "*mkl" }
liblapack = { version = ">=3.9,<4", build = "*mkl" }
liblapacke = { version = ">=3.9,<4", build = "*mkl" }

[target.win-64.activation]
scripts = ["tools/activate_windows.bat"]

[target.win-64.activation.env]
# Ninja comes from the shared activation block below; these two clear the
# Visual Studio generator's platform/toolset fields, which only mean anything
# to that generator.
CMAKE_GENERATOR_PLATFORM = ""
CMAKE_GENERATOR_TOOLSET = ""
# Interprocedural optimization is off because MSVC's /GL rejects the mixed
# static-archive link cytnx produces; CMakeLists.txt otherwise turns it on for
# every non-Apple platform. CMAKE_ARGS is read by scikit-build-core, so this
# covers the install-python tasks only -- the tasks that invoke cmake directly
# pass the same -D on their command line, because plain cmake ignores this
# variable.
CMAKE_ARGS = "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF"

# Which presets from CMakePresets.json the tasks drive. They live here rather
# than being written into the tasks so that each task is defined exactly once:
# a task defined by two features at the same time makes `pixi run <task>`
# ambiguous and forces every invocation to carry -e. Selecting an environment
# is what selects the BLAS vendor, on every platform.
#
# CMAKE_GENERATOR is set because ninja is the only build tool in this
# workspace. CMake would otherwise default to Unix Makefiles on Linux and
# macOS and fail for want of a make program.
[activation.env]
CMAKE_GENERATOR = "Ninja"
CYTNX_PRESET = "openblas-cpu"

[feature.mkl.activation.env]
CYTNX_PRESET = "mkl-cpu"

# Every task works in the one build tree the selected preset names,
# build/$CYTNX_PRESET, so the C++ suite and the Python tests share a single
# set of object files and an incremental rebuild serves both. The editable
# install is pointed at that same directory rather than one of its own.
#
# CYTNX_PRESET names a release preset, with RUN_TESTS turned on so the tree
# still carries the GoogleTest binary. It cannot be a debug-* preset: those
# set USE_DEBUG, which instruments the extension with AddressSanitizer and
# exports the sanitizer link option, and importing that into this
# environment's ordinary Python aborts unless the ASan runtime is preloaded
# first. ci-cmake_tests.yml keeps USE_DEBUG off for the same reason. Run
# `cmake --preset debug-openblas-cpu` directly when the sanitizer is wanted.
#
# pybind11_DIR is passed because pybind11 is a PyPI package: its CMake package
# config lives under site-packages, where find_package() does not search.
# scikit-build-core adds that directory itself, so only the direct cmake call
# needs the hint.
#
# Windows overrides these below, where the commands have to run inside
# tools/activate_windows.bat.
[tasks]
setup = "git submodule update --init --recursive"
doctor = "cmake --version && ninja --version && python --version && $CXX --version"

configure = { cmd = "cmake --preset $CYTNX_PRESET -DRUN_TESTS=ON -Dpybind11_DIR=$(python -m pybind11 --cmakedir)", depends-on = ["setup"] }
build = { cmd = "cmake --build --preset $CYTNX_PRESET --target test_main", depends-on = ["configure"] }
test-cpp = { cmd = "ctest --test-dir build/$CYTNX_PRESET --output-on-failure", depends-on = ["build"] }

# .[dev] brings in the runtime, test and stub-generation packages pyproject.toml
# declares. --no-build-isolation makes the build use this environment's pinned
# pybind11, the same one the configure task resolved, instead of provisioning a
# second copy. RUN_TESTS goes through cmake.define, which is additive, so it
# does not displace the preset in cmake.args.
install-python = { cmd = "python -m pip install --editable .[dev] --no-build-isolation --verbose --config-settings=build-dir=build/$CYTNX_PRESET --config-settings=cmake.args=--preset=$CYTNX_PRESET --config-settings=cmake.define.RUN_TESTS=ON", depends-on = ["setup"] }
test-python = { cmd = "python -m pytest pytests --doctest-modules", depends-on = ["install-python"] }
format = "pre-commit run --all-files"

[target.win-64.tasks]
check-windows-layout = "tools\\activate_windows.bat python tools/prepare_windows_import_libraries.py --check"
prepare-windows = "tools\\activate_windows.bat python tools/prepare_windows_import_libraries.py"
doctor = "tools\\activate_windows.bat --doctor"

# Interprocedural optimization is off because MSVC's /GL rejects the mixed
# static-archive link cytnx produces.
configure = { cmd = "tools\\activate_windows.bat cmake --preset $CYTNX_PRESET -DRUN_TESTS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -Dpybind11_DIR=$(python -m pybind11 --cmakedir)", depends-on = ["setup", "prepare-windows"] }
build = { cmd = "tools\\activate_windows.bat cmake --build --preset $CYTNX_PRESET", depends-on = ["configure"] }
# CTest's per-case GoogleTest discovery launches 1854 short-lived processes on
# Windows. Run the same complete suite once in the native GoogleTest executable
# to retain one initialized native runtime and keep local test runs practical.
test-cpp = { cmd = "..\\tools\\activate_windows.bat ..\\build\\$CYTNX_PRESET\\tests\\test_main.exe", cwd = "tests", depends-on = ["build"] }

install-python = { cmd = "tools\\activate_windows.bat python -m pip install --editable .[dev] --no-build-isolation --verbose --config-settings=build-dir=build/$CYTNX_PRESET --config-settings=cmake.args=--preset=$CYTNX_PRESET", depends-on = ["setup", "prepare-windows"] }
test-python = { cmd = "tools\\activate_windows.bat python -m pytest pytests --doctest-modules", depends-on = ["install-python"] }
format = "tools\\activate_windows.bat pre-commit run --all-files"

[feature.cuda]
# Linux and Windows. macOS has no CUDA at all. The two differ in where the
# toolkit comes from and in how much of it exists, so the dependencies and the
# tasks are split per platform below.
platforms = ["linux-64", "win-64"]

[feature.cuda.target.linux-64.dependencies]
# conda-forge carries the whole stack for linux-64, cuQuantum included, so a
# Linux CUDA build needs no system CUDA toolkit and gives up nothing: it uses
# the ordinary openblas-cuda / mkl-cuda presets with USE_CUQUANTUM on.
cuda-toolkit = "~=13.3"
cuda-nvcc = "~=13.3"
cutensor = "~=2.7"
cuquantum = "*"
custatevec = "*"
cutensornet = { version = "*", build = "nompi_*" }

[feature.cuda.target.win-64.pypi-dependencies]
# conda-forge publishes no cuTensorNet or cuStateVec for win-64 -- NVIDIA does
# not build them for Windows (#1111) -- so Windows takes the CUDA toolkit and
# cuTENSOR from NVIDIA's PyPI wheels instead, the direction #1023 established,
# and builds the mkl-cuda-windows preset with USE_CUQUANTUM off.
cuda-toolkit = { version = "~=13.3.0", extras = [
  "nvcc",
  "cccl",
  "cudart",
  "cublas",
  "cusolver",
  "cusparse",
  "curand",
] }
cutensor-cu13 = "~=2.7.0"

[feature.cuda.activation.env]
# cudafe++ can use substantial memory on this template-heavy codebase, so cap
# the parallelism CUDA builds inherit. This reaches scikit-build-core's build
# in install-python-cuda; the build-cuda tasks pass -j 2 on their command line
# instead, because the build preset's own `jobs` field would otherwise win.
CMAKE_BUILD_PARALLEL_LEVEL = "2"

[feature.cuda.target.linux-64.activation.env]
# The finders in CMakeLists.txt require these roots explicitly; on Linux they
# are the Pixi environment itself. The cuda environment carries the mkl
# feature, so the preset is the MKL one on both platforms.
CUTENSOR_ROOT = "$CONDA_PREFIX"
CUQUANTUM_ROOT = "$CONDA_PREFIX"
CYTNX_CUDA_PRESET = "mkl-cuda"

[feature.cuda.target.win-64.activation.env]
CMAKE_ARGS = "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF"
CYTNX_CUDA_PRESET = "mkl-cuda-windows"

[feature.cuda.tasks]
configure-cuda = { cmd = "cmake --preset $CYTNX_CUDA_PRESET -Dpybind11_DIR=$(python -m pybind11 --cmakedir)", depends-on = ["setup"] }
build-cuda = { cmd = "cmake --build --preset $CYTNX_CUDA_PRESET -j 2", depends-on = ["configure-cuda"] }
install-python-cuda = { cmd = "python -m pip install --editable .[dev] --no-build-isolation --verbose --config-settings=build-dir=build/$CYTNX_CUDA_PRESET --config-settings=cmake.args=--preset=$CYTNX_CUDA_PRESET", depends-on = ["setup"] }

[feature.cuda.target.win-64.tasks]
# The PyPI wheels ship a layout MSVC cannot link against as-is; see
# tools/prepare_windows_import_libraries.py. The conda-forge packages Linux
# uses need no such repair, so these three tasks exist on Windows only.
check-cuda-layout = "tools\\activate_windows.bat python tools/prepare_windows_import_libraries.py --cuda --check"
prepare-cuda = "tools\\activate_windows.bat python tools/prepare_windows_import_libraries.py --cuda"
cuda-doctor = { cmd = "tools\\activate_windows.bat --cuda-doctor", depends-on = ["prepare-cuda"] }

configure-cuda = { cmd = "tools\\activate_windows.bat cmake --preset $CYTNX_CUDA_PRESET -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -Dpybind11_DIR=$(python -m pybind11 --cmakedir)", depends-on = ["setup", "prepare-cuda"] }
build-cuda = { cmd = "tools\\activate_windows.bat cmake --build --preset $CYTNX_CUDA_PRESET -j 2", depends-on = ["configure-cuda"] }
install-python-cuda = { cmd = "tools\\activate_windows.bat python -m pip install --editable .[dev] --no-build-isolation --verbose --config-settings=build-dir=build/$CYTNX_CUDA_PRESET --config-settings=cmake.args=--preset=$CYTNX_CUDA_PRESET", depends-on = ["setup", "prepare-cuda"] }

[environments]
# default is OpenBLAS on every platform, matching the openblas-cpu preset the
# wheels are built with. mkl and cuda exist only on the platforms their
# features declare.
default = { features = ["python310", "openblas"], solve-group = "openblas" }
mkl = { features = ["python310", "mkl"], solve-group = "mkl" }
cuda = { features = ["python310", "mkl", "cuda"], solve-group = "mkl" }
