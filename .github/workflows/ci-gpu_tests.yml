name: GPU Tests

# Builds Cytnx with CUDA (cuTENSOR + cuQuantum) and runs the gpu_test_main
# gtest suite on the self-hosted GPU runner. This is a *native* build: the
# runner already provides the CUDA toolkit, cuTENSOR, cuQuantum, OpenBLAS and
# gtest system-wide, so unlike a GitHub-hosted runner there is no conda/PyPI
# toolchain install step.
#
# Runs on manual dispatch, on same-repo pull requests, and on push to master.
# The push trigger covers code merged from a fork PR (which the pull_request
# run deliberately skips), exercising the trusted merged revision on master.
# Fork pull requests are NOT executed on the self-hosted runner: on a public
# repo that would let a fork run arbitrary code on our hardware. The job-level
# `if` enforces this (a push event is never a fork, so it always runs).
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Manual runs always; PRs only when the head branch is in this repo (not a
    # fork). Never let fork PR code run on the self-hosted GPU runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Matches the self-hosted runner's labels (see `gh api .../actions/runners`).
    runs-on: [self-hosted, linux, x64, cuda, gpu]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # cuTENSOR / cuQuantum install roots on the runner. Kept as repository
      # Actions variables so this file carries no machine-specific paths; the
      # FindCUTENSOR / FindCUQUANTUM modules require both to be set.
      CUTENSOR_ROOT: ${{ vars.CUTENSOR_ROOT }}
      CUQUANTUM_ROOT: ${{ vars.CUQUANTUM_ROOT }}
      # Both of the runner's GPUs are RTX 4070 Ti SUPER (Ada, sm_89). CUDA 13
      # dropped sm_70, so the repo-default fatbin can't be used as-is; pin per
      # runner.
      GPU_CUDA_ARCH: ${{ vars.GPU_CUDA_ARCH || '89' }}
      # Pin the suite to one GPU. The runner is also the maintainer's
      # workstation and has two cards, so the default device is routinely busy
      # with interactive work. That is not a benign slowdown: Cytnx allocates
      # through cudaMallocManaged, which succeeds on a full device and then
      # faults while migrating pages, and cudaErrorIllegalAddress is sticky. So
      # contention surfaces as a dozen tests failing at an innocent
      # cudaMalloc/cudaFree rather than as an out-of-memory error, which reads
      # exactly like a real regression (run 38230511963).
      #
      # CUDA_DEVICE_ORDER=PCI_BUS_ID makes the CUDA index equal the nvidia-smi
      # index, so this number means the same thing in the workflow, in the
      # `nvidia-smi -i` query below, and in a human's `nvidia-smi` output.
      # Without it CUDA orders devices FASTEST_FIRST, an arbitrary tie-break
      # between identical cards.
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${{ vars.GPU_CI_DEVICE || '1' }}
      BUILD_DIR: ${{ github.workspace }}/build_gpu
      # Prefix the arpack step below creates; read by the configure step and by
      # the test run, which needs libarpack.so on the loader path.
      ARPACK_PREFIX: ${{ github.workspace }}/arpack-prefix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # When re-running a PR job, GitHub Actions reuses the merge commit from the
      # original run. Re-merge the current base so we always test against its tip.
      - name: Merge with latest target branch (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}
          git submodule update --init --recursive

      - name: Put CUDA toolkit on PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      # nvidia-smi ignores CUDA_VISIBLE_DEVICES, so it still shows both cards --
      # which is what we want in the log, because the process list on the *other*
      # card is the evidence that explains a contention failure.
      - name: GPU and toolkit info
        run: |
          nvidia-smi
          nvcc --version
          read -r free total < <(nvidia-smi -i "$CUDA_VISIBLE_DEVICES" \
            --query-gpu=memory.free,memory.total \
            --format=csv,noheader,nounits | tr -d ',')
          echo "Pinned to GPU $CUDA_VISIBLE_DEVICES: ${free} MiB free of ${total} MiB"
          # Half the card is a heuristic, not a measured requirement: a clean run
          # leaves the pinned GPU almost entirely free, so anything below this
          # means another process is resident and a failure needs checking
          # against the process list before it is believed.
          if [ "$free" -lt $((total / 2)) ]; then
            msg="Only ${free} MiB of ${total} MiB free on GPU ${CUDA_VISIBLE_DEVICES} before the suite started."
            msg="${msg} Another process is using this GPU, so managed-memory tests can fail with a sticky"
            msg="${msg} cudaErrorIllegalAddress reported at an unrelated cudaMalloc/cudaFree. Check the process"
            msg="${msg} list in the nvidia-smi output above before treating a failure as a code regression."
            echo "::warning title=GPU ${CUDA_VISIBLE_DEVICES} is busy::${msg}"
          fi

      # cytnx resolves arpack through find_package(arpackng CONFIG), and the
      # runner's system arpack ships the library and headers without a CMake
      # package config. Provision conda-forge's arpack -- the same package the
      # released wheels and the GitHub-hosted jobs build against, which does ship
      # lib/cmake/arpackng -- into a workspace-local prefix.
      #
      # micromamba is fetched as a single static binary into the runner's temp
      # dir rather than installing a conda distribution: nothing outside the
      # workspace changes, and no shell profile is touched, so the job keeps the
      # plain (non-login) shell the rest of the steps use. The prefix carries
      # arpack's own BLAS/LAPACK and libgfortran, which is what makes it
      # self-contained on a runner whose other dependencies come from apt.
      - name: Provision arpack from conda-forge
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create --yes --prefix "$ARPACK_PREFIX" \
            -c conda-forge "arpack=*=nompi*"
          test -f "$ARPACK_PREFIX/lib/cmake/arpackng/arpackng-config.cmake"

      - name: Configure (CUDA Release, C++ tests, no Python)
        run: >-
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_CUDA=ON -DUSE_CUTENSOR=ON -DUSE_CUQUANTUM=ON
          -DRUN_TESTS=ON -DBUILD_PYTHON=OFF
          -DCMAKE_CUDA_ARCHITECTURES="$GPU_CUDA_ARCH"
          -DCMAKE_PREFIX_PATH="$ARPACK_PREFIX"

      - name: Build gpu_test_main
        run: cmake --build "$BUILD_DIR" -j "$(nproc)" --target gpu_test_main

      # `-L gpu` selects only the tests tagged with the `gpu` label added in
      # tests/gpu/CMakeLists.txt (the CPU suite is already covered by
      # ci-cmake_tests.yml, so there is no need to re-run it here).
      - name: Run GPU test suite
        run: |
          export LD_LIBRARY_PATH="$ARPACK_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          GTEST_COLOR=1 ctest --test-dir "$BUILD_DIR" -L gpu --output-on-failure
