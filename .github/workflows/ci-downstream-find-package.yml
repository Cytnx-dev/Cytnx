name: Downstream find_package

# Verifies that a downstream project consuming cytnx purely through
# `find_package(Cytnx CONFIG)` + `Cytnx::cytnx` can configure, build, link,
# and run against cytnx from BOTH:
#   * the build tree   (export(EXPORT cytnx_targets ...) / build-dir CytnxConfig.cmake)
#   * the install tree  (install(EXPORT ...) under <prefix>/lib/cmake/cytnx)
#
# The consumer lives in tests/downstream_find_package/ and exercises a
# permute() call, which routes through the HPTT-backed transpose — so a
# clean link proves the exported package pulls in cytnx's bundled
# Cytnx::hptt_static and its OpenMP / Boost / LAPACK dependencies without
# the consumer naming any of them.
#
# Both trees are exercised twice, through the `configuration` matrix:
#   * uninstrumented (RUN_TESTS=OFF) — what a real downstream user builds.
#   * coverage       (RUN_TESTS=ON)  — cytnx is a STATIC archive, so objects
#     compiled with `--coverage` leave gcov symbols unresolved until the
#     consumer's final link. cytnx therefore carries `--coverage` as an
#     INTERFACE link option, unconditionally rather than under
#     $<BUILD_INTERFACE:>, because an instrumented libcytnx.a needs the coverage
#     runtime after being installed just as much as before. This variant is what
#     proves that: dropping the option from the install interface would leave
#     the install-tree consumer with undefined `__gcov_*` references.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  DownstreamFindPackage:
    name: DownstreamFindPackage (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      # Report both configurations on a failure; one being broken says nothing
      # about the other.
      fail-fast: false
      matrix:
        include:
          - configuration: uninstrumented
            run_tests: "OFF"
          - configuration: coverage
            run_tests: "ON"
    defaults:
      run:
        # Login shell (-l) so conda activation is sourced (this is what sets
        # CC/CXX to the conda compilers in later steps); -e / -o pipefail so
        # the job fails on the first failing command (overriding the shell
        # drops GitHub's default `-eo pipefail`, so set it back).
        shell: bash -leo pipefail {0}
    env:
      # Build cytnx here, install it here, and build the consumer here, all
      # under the workspace so paths are stable across steps.
      CYTNX_BUILD_DIR: ${{ github.workspace }}/build
      CYTNX_INSTALL_DIR: ${{ github.workspace }}/install
      CONSUMER_SRC_DIR: ${{ github.workspace }}/tests/downstream_find_package
      # ccache wraps every C/C++ compile via CMake's compiler-launcher hook.
      # Mirror conda_build.yml's ccache settings so the recipe-equivalent
      # build hits the cache the same way.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G  # The limit of actions/cache is 10GB.
      CCACHE_NOHASHDIR: 1
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Match ci-cmake_tests.yml: re-runs of a PR job use the original merge
      # commit, so merge the latest target branch to test against current tip.
      # A committer identity is required because a non-fast-forward merge creates
      # a merge commit.
      - name: Merge with latest target branch (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}
          # Refresh submodules in case the merge moved any gitlinks.
          git submodule update --init --recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          use-mamba: true
          mamba-version: "*"

      - name: Cache Ccache Directory (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-downstream-${{ matrix.configuration }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-downstream-${{ matrix.configuration }}-${{ runner.os }}-${{ github.ref_name }}-

      - name: Cache Ccache Directory (pull_request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-downstream-${{ matrix.configuration }}-${{ runner.os }}-${{ github.event.pull_request.head.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-downstream-${{ matrix.configuration }}-${{ runner.os }}-${{ github.event.pull_request.head.ref }}-
            ccache-downstream-${{ matrix.configuration }}-${{ runner.os }}-${{ github.event.pull_request.base.ref }}-

      - name: Install native dependencies
        # TODO(deps-single-source): this native dependency set duplicates the
        # ones in ci-cmake_tests.yml ("Install native dependencies") and in
        # conda_build/meta.yaml (requirements.build/host). Merge the three into
        # a single shared source of truth. It is kept as an explicit list for
        # now because the conda recipe encodes its specs with Jinja
        # `compiler()` calls and `# [x86]` / `# [not x86]` selectors that only
        # conda-build can render, which is heavier than this job warrants.
        #
        # gtest/gmock are needed only by the coverage variant, whose RUN_TESTS=ON
        # makes tests/CMakeLists.txt require them at configure time (no test
        # binary is ever built here -- only the `cytnx` target is). OpenBLAS +
        # LAPACKE match the openblas-cpu preset used below. ccache backs the
        # CMAKE_*_COMPILER_LAUNCHER set in this job's env.
        #
        # libopenblas=*=*openmp* matches ci-cmake_tests.yml's own pin: without
        # it the solver is free to substitute a pthreads-threaded OpenBLAS
        # build, which runs its own thread pool independent of the consumer
        # binary's OpenMP usage (permute() -> HPTT, compiled with -fopenmp).
        # conda-forge's openmp OpenBLAS build hard-requires _openmp_mutex=*_llvm,
        # so this already forces the whole environment onto the single llvm
        # OpenMP runtime that the -fopenmp-compiled code also resolves to --
        # no separate _openmp_mutex pin is needed (see ci-cmake_tests.yml).
        run: |
          mamba install -y \
            cmake make boost git compilers ccache gtest gmock \
            blas=*=openblas "libopenblas=*=*openmp*" liblapacke arpack

      - name: Configure cytnx (openblas-cpu preset, USE_HPTT=ON)
        # The openblas-cpu preset inherits USE_HPTT=ON. Override
        # BUILD_PYTHON=OFF (this job is about the C++ package export, not the
        # Python wheel) and set RUN_TESTS from the matrix, which is what selects
        # coverage instrumentation. Pin the build dir and install prefix so
        # later steps have stable paths.
        #
        # HPTT_ENABLE_AVX=ON matches what the released x86_64 wheels ship, so
        # the exported Cytnx::hptt_static a downstream project links here is
        # the same one users get. This runner is ubuntu-latest, i.e. always
        # x86_64, and HPTT fails the configure outright if the option ever
        # reaches a non-x86 target.
        run: |
          cmake -S . -B "$CYTNX_BUILD_DIR" \
            --preset=openblas-cpu \
            -G "Unix Makefiles" \
            -DBUILD_PYTHON=OFF \
            -DRUN_TESTS=${{ matrix.run_tests }} \
            -DHPTT_ENABLE_AVX=ON \
            -DCMAKE_INSTALL_PREFIX="$CYTNX_INSTALL_DIR"

      - name: Build cytnx
        run: cmake --build "$CYTNX_BUILD_DIR" --target cytnx -j "$(nproc)"

      # --- Build tree consumer -------------------------------------------------
      # The build-tree export is emitted by export(EXPORT cytnx_targets ...)
      # plus the build-dir CytnxConfig.cmake; point the consumer at the build
      # dir via Cytnx_DIR (no install step has run yet).
      - name: Consumer against the BUILD TREE
        run: |
          cmake -S "$CONSUMER_SRC_DIR" -B "${{ github.workspace }}/consumer-build-tree" \
            -G "Unix Makefiles" \
            -DCytnx_DIR="$CYTNX_BUILD_DIR"
          cmake --build "${{ github.workspace }}/consumer-build-tree" -j "$(nproc)"
          "${{ github.workspace }}/consumer-build-tree/consumer"

      # --- Install tree consumer ----------------------------------------------
      - name: Install cytnx
        run: cmake --install "$CYTNX_BUILD_DIR"

      - name: Consumer against the INSTALL TREE
        # Use a fresh build dir and resolve the package from the install
        # prefix via CMAKE_PREFIX_PATH (the canonical way a real downstream
        # user would find an installed cytnx).
        run: |
          cmake -S "$CONSUMER_SRC_DIR" -B "${{ github.workspace }}/consumer-install-tree" \
            -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="$CYTNX_INSTALL_DIR"
          cmake --build "${{ github.workspace }}/consumer-install-tree" -j "$(nproc)"
          "${{ github.workspace }}/consumer-install-tree/consumer"
